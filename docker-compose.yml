name: msis
services:
  msis:
    # Builds locally from the Dockerfile so you always run the cloned code.
    # To use the prebuilt image instead, replace the `build:` block below with
    # `image: ghcr.io/ItzSufyan79/msis:latest`.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msis
    # Host port is configurable via MSIS_PORT in .env (defaults to 3000).
    ports:
      - "${MSIS_PORT:-3000}:3000"
    # Optional API keys / scanner backend — copy .env.template to .env and
    # fill in what you need. Missing file is ignored (keyless feeds still work).
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default
      - umami_default

  msis-cache:
    image: nginx:alpine
    container_name: msis-cache
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - msis
    restart: unless-stopped
    networks:
      - default

  msis-intel:
    build:
      context: ./intel
      dockerfile: Dockerfile
    container_name: msis-intel
    ports:
      - "4000:4000"
    restart: unless-stopped
    networks:
      - default

volumes:
  nginx-cache:

networks:
  umami_default:
    external: true

# ── CasaOS app-store metadata (ignored by plain Docker Compose) ──
x-casaos:
  architectures:
    - amd64
    - arm64
  main: msis
  author: ItzSufyan79
  developer: ItzSufyan79
  category: Network
  description:
    en_us: >-
      MSIS is a production-grade open-source marine oil spill intelligence and
      situational-awareness dashboard. It detects, characterises, traces and
      predicts spills from Sentinel-1 SAR imagery alongside live AIS vessel
      traffic on a single GPU-accelerated MapLibre interface. Most features
      work with no API keys.
  tagline:
    en_us: Real-time marine spill intelligence dashboard
  title:
    en_us: MSIS
  icon: https://raw.githubusercontent.com/ItzSufyan79/MSIS/master/public/casaos-icon.png
  thumbnail: https://raw.githubusercontent.com/ItzSufyan79/MSIS/master/public/og-image.png
  screenshot_link:
    - https://raw.githubusercontent.com/ItzSufyan79/MSIS/master/public/og-image.png
  scheme: http
  hostname: ""
  port_map: "3000"
  index: /
  webui_port: 3000
  envs:
    - container: SCANNER_URL
      description:
        en_us: "(Optional) RECON scanner backend URL, e.g. http://scanner:7700"
    - container: SCANNER_KEY
      description:
        en_us: "(Optional) RECON scanner shared secret (must match backend MSIS_KEY)."
    - container: FIRMS_API_KEY
      description:
        en_us: "(Optional) NASA FIRMS API key for active-fire data."
    - container: AIS_API_KEY
      description:
        en_us: "(Optional) aisstream.io key for maritime vessel tracking."
    - container: OPENSKY_CLIENT_ID
      description:
        en_us: "(Optional) OpenSky OAuth2 client id for higher aircraft rate limits."
    - container: OPENSKY_CLIENT_SECRET
      description:
        en_us: "(Optional) OpenSky OAuth2 client secret."
    - container: N2YO_API_KEY
      description:
        en_us: "(Optional) N2YO key for satellite tracking."
  ports:
    - container: "3000"
      description:
        en_us: "Web UI (HTTP)."
